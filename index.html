<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane Doe - Lead Engineer Portfolio</title>
    <!-- 
      LƯU Ý: Không viết CSS ở đây. 
      Bài tập yêu cầu commit HTML thuần túy (Atomic Commit). 
      Việc gộp CSS sẽ bị tính 0 điểm (One-shot prompt penalty).
    -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="skeleton.css">
</head>
<body>

    <!-- ATOMIC MILESTONE T-01: No div tags allowed -->
    
    <!-- STEP 3: Implement accessible skip-link -->
    <!-- Thẻ a này cho phép người dùng dùng phím Tab để nhảy thẳng tới nội dung chính -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Header với role banner (Vai trò banner giúp screen reader nhận diện đây là phần đầu trang) -->
    <header role="banner">
        <button id="theme-toggle" aria-label="Toggle dark mode">Toggle Theme</button>
        <h1>Jane Doe, Lead Engineer</h1>
    </header>
    
    <!-- Navigation với role navigation và aria-label để phân biệt với các nav khác nếu có -->
    <nav role="navigation" aria-label="Primary">
        <ul>
            <!-- Các liên kết phải trỏ đúng đến ID của section tương ứng -->
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
        </ul>
    </nav>
    
    <!-- Main content với id để skip-link trỏ tới, và role main -->
    <main id="main-content" role="main">
        <!-- Section About -->
        <section id="about">
            <h2>About Me</h2>
            <!-- Nội dung giả định (dấu ... trong hình) -->
            <p>I am a Lead Engineer with expertise in semantic web architecture and accessibility.</p>
        </section>
        
        <!-- Section Projects -->
        <section id="projects">
            <h2>Projects</h2>
            <!-- Nội dung giả định (dấu ... trong hình) -->
            <p>Here are some of the projects I have worked on...</p>
        </section>
        <section id="dashboard-component" aria-live="polite">
            <div id="state-loading" class="state-container">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
            </div>
        </section>
    </main>

        <!-- Nhúng JS -->
    <script src="script.js"></script>
</body>
</html>
